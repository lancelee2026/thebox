<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1f6fa8" />
    <meta name="description" content="翻砖块益智游戏 —— 翻转砖块，让它安全回家" />
    <title>翻砖块</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <header class="top-bar">
        <h1 class="brand">翻砖块</h1>
        <div class="hud">
          <span id="level-label">第 1 / 55 关</span>
          <span class="hud-sep" aria-hidden="true">·</span>
          <span id="moves-label">步数 0</span>
        </div>
        <div class="actions">
          <button type="button" id="btn-select" class="btn btn-icon" title="选关"></button>
          <button type="button" id="btn-undo" class="btn btn-icon" title="撤销"></button>
          <button type="button" id="btn-restart" class="btn btn-icon" title="重来"></button>
          <button type="button" id="btn-swap" class="btn btn-icon hidden" title="切换"></button>
          <button type="button" id="btn-mute" class="btn btn-icon" title="声音" aria-pressed="false"></button>
        </div>
      </header>

      <main class="stage">
        <p id="hint-mechanic" class="mechanic-hint hidden" aria-live="polite"></p>
        <div id="canvas-wrap">
          <div id="clear-fanfare" class="clear-fanfare hidden" role="status" aria-live="assertive">
            <div class="clear-stars" id="clear-stars" aria-hidden="true"></div>
            <p class="clear-caption" id="clear-caption"></p>
          </div>
          <canvas id="game-canvas" aria-label="游戏棋盘"></canvas>
        </div>
      </main>

      <div id="controls" class="controls" aria-label="方向键">
        <button type="button" class="pad" data-dir="up" id="pad-up" aria-label="上">▲</button>
        <div class="pad-row">
          <button type="button" class="pad" data-dir="left" id="pad-left" aria-label="左">◀</button>
          <button type="button" class="pad" data-dir="down" id="pad-down" aria-label="下">▼</button>
          <button type="button" class="pad" data-dir="right" id="pad-right" aria-label="右">▶</button>
        </div>
      </div>

      <p class="hint" id="hint">
        <span class="hint-keys">方向键 / WASD · </span><span class="hint-goal">将砖块挪入绿色区域</span>
      </p>
    </div>

    <div id="overlay" class="overlay hidden" aria-hidden="true" inert>
      <div class="panel panel-select" id="panel-select">
        <header class="panel-head">
          <h2>选择关卡</h2>
          <p id="select-progress" class="select-progress">已通关 0 / 55</p>
          <p id="select-stars" class="select-stars">星 0 / 165</p>
        </header>
        <div id="level-chapters" class="level-chapters"></div>
        <footer class="panel-foot">
          <button type="button" class="btn btn-ghost" id="btn-close-select">关闭</button>
        </footer>
      </div>
      <div class="panel panel-win hidden" id="panel-win">
        <h2>全部通关！</h2>
        <p id="win-text">你真棒</p>
        <button type="button" class="btn primary" id="btn-win-select">再玩一次</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
