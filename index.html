<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#3498db" />
    <meta name="description" content="翻砖块益智游戏 —— 翻转长方体，躺进绿色区域过关" />
    <title>翻砖块</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Nunito:wght@600;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Inline sprite so currentColor inherits into <use> -->
    <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
      <symbol id="icon-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="11" width="14" height="10" rx="2"/>
        <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
      </symbol>
      <symbol id="icon-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
      </symbol>
      <symbol id="icon-undo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 14 4 9l5-5"/>
        <path d="M4 9h10.5a5.5 5.5 0 1 1 0 11H12"/>
      </symbol>
      <symbol id="icon-restart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.6-6.4"/>
        <path d="M21 3v6h-6"/>
      </symbol>
      <symbol id="icon-swap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 3h5v5"/>
        <path d="M8 21H3v-5"/>
        <path d="M21 3 14 10"/>
        <path d="m3 21 7-7"/>
        <rect x="8.5" y="8.5" width="3" height="3" rx="0.5"/>
        <rect x="12.5" y="12.5" width="3" height="3" rx="0.5"/>
      </symbol>
      <symbol id="icon-sound" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 5 6 9H3v6h3l5 4V5z"/>
        <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
        <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
      </symbol>
      <symbol id="icon-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 5 6 9H3v6h3l5 4V5z"/>
        <path d="m22 9-6 6"/>
        <path d="m16 9 6 6"/>
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 13.5 9.5 18 19 7"/>
      </symbol>
    </svg>

    <div id="app">
      <header class="top-bar">
        <h1 class="brand">翻砖块</h1>
        <div class="hud">
          <span id="level-label">第 1 / 55 关</span>
          <span id="moves-label">步数 0</span>
        </div>
        <div class="actions">
          <button type="button" id="btn-select" class="btn" title="选关">选关</button>
          <button type="button" id="btn-undo" class="btn" title="撤销">撤销</button>
          <button type="button" id="btn-restart" class="btn" title="重来">重来</button>
          <button type="button" id="btn-swap" class="btn hidden" title="切换小方块（空格）">切换</button>
          <button type="button" id="btn-mute" class="btn" title="静音" aria-pressed="false">声音</button>
        </div>
      </header>

      <p id="hint-mechanic" class="mechanic-hint hidden" aria-live="polite"></p>

      <main class="stage">
        <div id="canvas-wrap">
          <canvas id="game-canvas"></canvas>
        </div>
      </main>

      <div id="controls" class="controls" aria-label="方向键">
        <button type="button" class="pad" data-dir="up" id="pad-up">▲</button>
        <div class="pad-row">
          <button type="button" class="pad" data-dir="left" id="pad-left">◀</button>
          <button type="button" class="pad" data-dir="down" id="pad-down">▼</button>
          <button type="button" class="pad" data-dir="right" id="pad-right">▶</button>
        </div>
      </div>

      <p class="hint" id="hint">方向键 / WASD 移动 · 把砖块完整躺进绿色区域</p>
    </div>

    <div id="overlay" class="overlay hidden" aria-hidden="true">
      <div class="panel" id="panel-select">
        <h2>选择关卡</h2>
        <div id="level-grid" class="level-grid"></div>
        <button type="button" class="btn primary" id="btn-close-select">关闭</button>
      </div>
      <div class="panel hidden" id="panel-win">
        <h2>全部通关！</h2>
        <p id="win-text">你真棒</p>
        <button type="button" class="btn primary" id="btn-win-select">再玩一次</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
